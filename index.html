<script>
        let currentDocumentText = null;

        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const statusDiv = document.getElementById('uploadStatus');
            if (fileInput.files.length === 0) {
                statusDiv.innerHTML = "Please select a file first.";
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            statusDiv.innerHTML = '<span class="loader">Uploading, scanning, and summarizing...</span>';

            try {
                const response = await fetch('/upload', { method: 'POST', body: formData });
                const data = await response.json();

                if (data.success) {
                    currentDocumentText = data.document_text; // Store text in memory securely
                    statusDiv.innerHTML = `Successfully uploaded & verified: <strong>${data.filename}</strong>`;
                    document.getElementById('summaryText').innerText = data.summary;
                    document.getElementById('summaryCard').classList.remove('hidden');
                    document.getElementById('qaCard').classList.remove('hidden');
                } else {
                    statusDiv.innerHTML = `<span style="color: #ef4444;">${data.error}</span>`;
                }
            } catch (err) {
                statusDiv.innerHTML = "An error occurred during upload.";
            }
        }

        async function askQuestion() {
            const question = document.getElementById('questionInput').value;
            const qaResult = document.getElementById('qaResult');
            const referenceText = document.getElementById('referenceText');
            
            if (!question.trim() || !currentDocumentText) return;

            qaResult.classList.remove('hidden');
            referenceText.innerHTML = '<span class="loader">AI is analyzing document context...</span>';

            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        document_text: currentDocumentText, 
                        question: question 
                    })
                });
                const data = await response.json();
                
                document.getElementById('answerHeading').innerText = "Assistant Answer:";
                referenceText.innerText = data.answer || data.error;
            } catch (err) {
                referenceText.innerText = "Failed to retrieve an answer.";
            }
        }
    </script>
